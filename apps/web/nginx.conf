server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # The PWA manifest; nginx's default mime map does not know the extension.
  types {
    application/manifest+json webmanifest;
  }
  include /etc/nginx/mime.types;

  gzip on;
  gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

  # Hashed build assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Share image, icons, robots and sitemap: real files or a real 404, never the app page, so link
  # previews and crawlers never receive HTML where they expect an image or text.
  location ~* \.(jpg|jpeg|png|webp|svg|ico|txt|xml|webmanifest)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # SPA fallback: client-side routes resolve to index.html, which must not be cached.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
