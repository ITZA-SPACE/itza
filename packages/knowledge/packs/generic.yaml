        end: "11-30",
        source: team_estimate,
        confidence: low,
        note: "Northern temperate default.",
      }
    n_credit_kg_ha: { value: -10, source: team_estimate, confidence: low }
    residue_root_index: { value: 0.75, source: team_estimate, confidence: low }
    cover_months: { value: 6, source: team_estimate, confidence: low }
