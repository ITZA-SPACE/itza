pests:
  - id: residue_borne_leaf_disease
    name: Residue-borne leaf disease of cereals
    type: fungal
    hosts:
      families: [poaceae]
      crops: [generic_winter_cereal]
    weather_driver: wet
    soil_persistence_years: { value: 1, source: team_estimate, confidence: low }
    min_break_years: { value: 1, source: team_estimate, confidence: low }
  - id: soilborne_legume_disease
    name: Soilborne disease of legumes
    type: fungal
    hosts:
      families: [fabaceae]
      crops: [generic_grain_legume]
    weather_driver: wet
    soil_persistence_years: { value: 4, source: team_estimate, confidence: low }
    min_break_years: { value: 3, source: team_estimate, confidence: low }
