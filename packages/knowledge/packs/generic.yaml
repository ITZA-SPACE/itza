# Knowledge pack. Validated by scripts/build.ts against src/schema.ts.
schema: knowledge-pack/1.0
id: generic
name: Generic temperate fallback
version: 1.0.0
generic: true
region:
  description: Fallback used outside every named region. Northern temperate defaults, not tuned to any place.
  bbox: null
review:
  status: needs_expert_review
  note: Generic fallback. Every value is a table value or a team estimate for a typical temperate site. Results are indicative only; use a regional pack when one exists.
sources:
  fao56_t11:
    citation: "Allen, R.G., Pereira, L.S., Raes, D., Smith, M. (1998). Crop evapotranspiration, FAO Irrigation and Drainage Paper 56, Table 11: lengths of crop development stages."
    url: https://www.fao.org/4/x0490e/x0490e0b.htm
  fao56_t12:
    citation: "Allen et al. (1998), FAO Irrigation and Drainage Paper 56, Table 12: single crop coefficients Kc. Kc ini is the table's group value."
    url: https://www.fao.org/4/x0490e/x0490e0b.htm
  fao56_t22:
    citation: "Allen et al. (1998), FAO Irrigation and Drainage Paper 56, Table 22: maximum rooting depth and depletion fraction p. Ranges are reduced to their midpoint."
    url: https://www.fao.org/4/x0490e/x0490e0e.htm
  team_estimate:
    citation: "ITZA team estimate from typical agronomic ranges. No single citable table. Needs review by a local agronomist before field use."
calendar:
  agricultural_year_start_month: { value: 9, source: team_estimate, confidence: low }
  sowing_windows:
    autumn:
      {
        start: "09-15",
        end: "11-30",
        source: team_estimate,
        confidence: low,
        note: "Northern temperate default.",
      }
    spring: { start: "03-15", end: "05-31", source: team_estimate, confidence: low }
  bare_ndvi_threshold:
    {
      value: 0.25,
      source: team_estimate,
      confidence: low,
      note: "MODIS or HLS NDVI of bare soil is typically 0.1 to 0.2; confirm per site.",
    }
crops:
  - id: generic_winter_cereal
    name: Winter cereal (generic)
    kind: crop
    family: poaceae
    requires_irrigation: false
    kc_ini: { value: 0.4, source: fao56_t12, confidence: medium }
    kc_mid:
      { value: 1.15, source: fao56_t12, confidence: medium, note: "Winter wheat on frozen soils." }
    kc_end: { value: 0.3, source: fao56_t12, confidence: medium }
    stage_days:
      ini:
        {
          value: 20,
          source: fao56_t11,
          confidence: medium,
          note: "FAO winter wheat row 20-60-70-30.",
        }
      dev: { value: 60, source: fao56_t11, confidence: medium }
      mid: { value: 70, source: fao56_t11, confidence: medium }
      late: { value: 30, source: fao56_t11, confidence: medium }
    season_length_days:
      { value: 180, source: fao56_t11, confidence: medium, note: "Sum of the stage lengths." }
    root_depth_ini_m:
      {
        value: 0.15,
        source: team_estimate,
        confidence: low,
        note: "Seedling rooting depth; FAO-56 gives no value.",
      }
    root_depth_max_m:
      {
        value: 1.65,
        source: fao56_t22,
        confidence: medium,
        note: "Winter wheat range 1.5 to 1.8 m.",
      }
    depletion_fraction:
      {
        value: 0.55,
        source: fao56_t22,
        confidence: medium,
        note: "FAO-56 Table 22 value for ETc of about 5 mm/day.",
      }
    t_base_c: { value: 0, source: team_estimate, confidence: low }
    t_opt_c: { value: 20, source: team_estimate, confidence: low }
    t_max_c: { value: 32, source: team_estimate, confidence: low }
    frost_threshold_c:
      ini: { value: -10, source: team_estimate, confidence: low }
      dev: { value: -8, source: team_estimate, confidence: low }
      mid: { value: -2, source: team_estimate, confidence: low }
      late: { value: -3, source: team_estimate, confidence: low }
    heat_threshold_c:
      ini: { value: 36, source: team_estimate, confidence: low }
      dev: { value: 34, source: team_estimate, confidence: low }
      mid: { value: 31, source: team_estimate, confidence: low }
      late: { value: 32, source: team_estimate, confidence: low }
    sowing_window:
