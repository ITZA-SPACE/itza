# Knowledge pack. Validated by scripts/build.ts against src/schema.ts.
schema: knowledge-pack/1.0
id: us-central-great-plains
name: US Central Great Plains (semi-arid, rainfed)
version: 1.0.0
generic: false
region:
  description: Semi-arid rainfed wheat belt of the US Central Great Plains, including Akron, Colorado. Bounding box is approximate.
  bbox: [-106.0, 36.5, -97.0, 43.5]
review:
  status: needs_expert_review
  note: FAO-56 values are table rows or range midpoints; planting dates come from USDA NASS and ARS. Stress thresholds, nitrogen credit, residue, cover, forage and pest values are team estimates (low) to be checked against USDA-ARS and extension publications. The crop set covers the Akron long-term rotations.
sources:
  fao56_t11:
    citation: "Allen, R.G., Pereira, L.S., Raes, D., Smith, M. (1998). Crop evapotranspiration, FAO Irrigation and Drainage Paper 56, Table 11: lengths of crop development stages."
    url: https://www.fao.org/4/x0490e/x0490e0b.htm
  fao56_t12:
    citation: "Allen et al. (1998), FAO Irrigation and Drainage Paper 56, Table 12: single crop coefficients Kc. Kc ini is the table's group value."
    url: https://www.fao.org/4/x0490e/x0490e0b.htm
  fao56_t22:
    citation: "Allen et al. (1998), FAO Irrigation and Drainage Paper 56, Table 22: maximum rooting depth and depletion fraction p. Ranges are reduced to their midpoint."
    url: https://www.fao.org/4/x0490e/x0490e0e.htm
  usda_nass_hb628:
    citation: "USDA NASS (1997). Usual Planting and Harvesting Dates for U.S. Field Crops, Agricultural Handbook 628."
    url: https://esmis.nal.usda.gov/concern/publications/vm40xr56k
  ars_akron_2011:
    citation: "USDA ARS AgResearch Magazine (2011). Rotations at Akron, Colorado: wheat-fallow compared with more intensive no-till rotations."
    url: https://agresearchmag.ars.usda.gov/2011/jan/rotations
  unl_ec137:
    citation: "Nelson, L.A. et al. (2008). Proso millet production guide, University of Nebraska-Lincoln Extension EC137."
    url: https://extensionpubs.unl.edu/publication/ec137/2008/html/view
  ars_proso_planting:
    citation: "USDA ARS. Planting date effect on no-till proso millet (Akron, Colorado)."
    url: https://www.ars.usda.gov/ARSUserFiles/30100500/Publications%201999-1990/47%20Planting%20Date%20Effect%20on%20No-Till%20Proso%20Millet.pdf
  team_estimate:
    citation: "ITZA team estimate from typical agronomic ranges. No single citable table. Needs review by a local agronomist before field use."
calendar:
  agricultural_year_start_month: { value: 9, source: team_estimate, confidence: low }
  sowing_windows:
    autumn:
      {
        start: "09-01",
        end: "10-31",
        source: usda_nass_hb628,
        confidence: medium,
        note: "Winter wheat seeding.",
