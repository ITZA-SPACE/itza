# Knowledge pack. Validated by scripts/build.ts against src/schema.ts.
schema: knowledge-pack/1.0
id: dz-high-plains
name: Algeria high plains (Hauts Plateaux)
version: 1.0.0
generic: false
region:
  description: Semi-arid cereal and pulse belt of the Algerian high plains, including Setif. Bounding box is approximate.
  bbox: [-1.5, 34.0, 8.5, 36.5]
review:
  status: needs_expert_review
  note: FAO-56 values are table rows or range midpoints. Everything marked low (stress thresholds, nitrogen credit, residue, cover, forage, pests, most sowing windows) is a team estimate that a local agronomist must review before field use.
sources:
  fao56_t11:
    citation: "Allen, R.G., Pereira, L.S., Raes, D., Smith, M. (1998). Crop evapotranspiration, FAO Irrigation and Drainage Paper 56, Table 11: lengths of crop development stages."
    url: https://www.fao.org/4/x0490e/x0490e0b.htm
  fao56_t12:
    citation: "Allen et al. (1998), FAO Irrigation and Drainage Paper 56, Table 12: single crop coefficients Kc. Kc ini is the table's group value."
    url: https://www.fao.org/4/x0490e/x0490e0b.htm
  fao56_t22:
    citation: "Allen et al. (1998), FAO Irrigation and Drainage Paper 56, Table 22: maximum rooting depth and depletion fraction p. Ranges are reduced to their midpoint."
    url: https://www.fao.org/4/x0490e/x0490e0e.htm
  giews_dza:
    citation: "FAO GIEWS Country Brief, Algeria: crop calendar (cereal sowing and harvest months)."
    url: https://www.fao.org/giews/countrybrief/country.jsp?code=DZA
  team_estimate:
    citation: "ITZA team estimate from typical agronomic ranges. No single citable table. Needs review by a local agronomist before field use."
calendar:
  agricultural_year_start_month: { value: 9, source: team_estimate, confidence: low }
  sowing_windows:
    autumn:
      {
        start: "10-15",
        end: "12-31",
        source: giews_dza,
        confidence: medium,
        note: "Cereal sowing months.",
      }
    spring: { start: "02-15", end: "04-30", source: team_estimate, confidence: low }
  bare_ndvi_threshold:
    {
      value: 0.25,
      source: team_estimate,
      confidence: low,
      note: "MODIS or HLS NDVI of bare soil is typically 0.1 to 0.2; confirm per site.",
    }
