[project]
name = "itza-prithvi"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "earthaccess>=0.19.0",
    "huggingface-hub>=2.4.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "terratorch>=1.2.14",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["unit: offline pure pipeline checks"]
