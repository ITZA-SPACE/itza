[project]
name = "itza-data-store"
version = "0.1.0"
description = "Shared, versioned dataset store on Google Cloud Storage: manifest, checksums and team sync"
requires-python = ">=3.13"
dependencies = ["pyyaml>=6.0.3"]

[project.optional-dependencies]
fetch = ["earthaccess==0.19.0", "h5py>=3.14", "h5netcdf>=1.6", "numpy>=2.3", "xarray>=2025.9"]

[dependency-groups]
dev = [
    "h5netcdf>=1.6",
    "h5py>=3.14",
    "numpy>=2.3",
    "xarray>=2025.9",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261111",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["sync.py", "clip.py", "tests"]

[[tool.mypy.overrides]]
module = ["earthaccess.*", "h5py.*", "h5netcdf.*", "xarray.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers", "--cov=sync", "--cov=clip", "--cov-branch", "--cov-fail-under=90"]
markers = ["unit: pure manifest and checksum logic", "integration: offline end-to-end sync with a fake bucket"]
