# Dataset store manifest (issue #103). One entry per object set; the store holds area-of-interest
# clips and derived products, never global archives.
#
# status: planned  the set is approved on paper but nothing was transferred; `files` is empty.
# status: synced   `files` lists every object with its byte size and SHA-256 (`sync.py verify`).
#
# Object layout in the bucket: <kind>/<source>/<version>/<path>, with kind raw or derived.
# Bounding boxes are west,south,east,north. Sizes in `estimate_gb` are CMR-based estimates to be
# replaced by measured sizes after the first sync (see README).
