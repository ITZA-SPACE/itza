      US Central Great Plains, near Akron, Colorado (40.15 N, 103.15 W): the ML training
      anchor point closest to the USDA-ARS Akron station; POWER Projection verified for this
      point 2026-11-09. Candidate traditional wheat-fallow parcel; CDL history not yet checked
      (service unavailable this session).
    geometry:
      type: Polygon
      coordinates:
        - - [-103.152057, 40.148428]
          - [-103.147943, 40.148428]
          - [-103.147943, 40.151572]
          - [-103.152057, 40.151572]
          - [-103.152057, 40.148428]

