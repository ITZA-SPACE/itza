# Hero fields for the demo (#17). Exact polygons are "chosen from data" (PRD §13): story field
# confirmed by real HLS NDVI access (see pipelines/README.md); proof fields are provisional
# squares around the Great Plains points already used for ML training (pipelines/ml/capture.py),
# pending a live CDL check of their crop history (the public CropScape service returned HTTP 500
# for every query during this session; see docs/NASA_DATA_SOURCES.md).
schema: hero-fields/1.0

fields:
  - id: semi-arid-winter-cereal
    role: story
    region_pack: dz-high-plains
    rationale: >
      Sétif high plains, Algeria: rainfed durum wheat alternating with fallow, the human story
      (PRD §4.2). Real NDVI access confirmed 2026-11-12 (one HLS granule, July 2024).
    geometry:
      type: Polygon
      coordinates:
        - - [5.32804, 36.11842]
          - [5.33196, 36.11842]
          - [5.33196, 36.12158]
          - [5.32804, 36.12158]
          - [5.32804, 36.11842]

