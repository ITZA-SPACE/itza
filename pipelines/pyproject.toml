[project]
name = "itza-demo-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "itza-science>=0.1.0",
    "pyyaml>=6.0.2",
]

[tool.uv.sources]
itza-science = { path = "../services/science-api", editable = true }

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "unit: isolated offline pipeline tests",
    "smoke: end-to-end pipeline run against fixtures, no network",
]

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "respx>=0.22.0",
    "ruff>=0.17.4",
]
