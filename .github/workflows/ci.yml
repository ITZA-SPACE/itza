name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-science-api:
    name: Backend · science-api (lint, types, unit + integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/science-api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          working-directory: services/science-api
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  backend-si-gateway:
    name: Backend · si-gateway (lint, types, tests, bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run lint format:check typecheck test build --filter=@itza/si-gateway

  contracts:
    name: Contracts · schemas, engine and knowledge tests, generated files up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          working-directory: services/science-api
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
        working-directory: services/science-api
      - run: pnpm schemas:check
      - run: pnpm exec turbo run lint format:check typecheck test --filter=@itza/engine --filter=@itza/knowledge

  frontend:
    name: Frontend · web and packages (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run lint format:check typecheck test build --filter=@itza/web... --filter=./packages/*
        env:
          VITE_SCIENCE_API_URL: https://api.example.invalid
          VITE_SI_GATEWAY_URL: https://si.example.invalid

  pipelines:
    name: Pipelines · demo bundles and ML (lint, types, offline tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          working-directory: pipelines
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
        working-directory: pipelines
      - run: uv run ruff check build_demo.py capture_fixtures.py validate_bundle.py tests
        working-directory: pipelines
      - run: uv run ruff format --check build_demo.py capture_fixtures.py validate_bundle.py tests
        working-directory: pipelines
      - run: uv run mypy
        working-directory: pipelines
      - run: uv run pytest
        working-directory: pipelines
      - run: uv sync --locked
        working-directory: pipelines/ml
      - run: uv run ruff check .
        working-directory: pipelines/ml
      - run: uv run ruff format --check .
        working-directory: pipelines/ml
      - run: uv run mypy data.py capture.py enrich.py train.py tests
        working-directory: pipelines/ml
      - run: uv run pytest
        working-directory: pipelines/ml

  pipelines-prithvi:
    name: Pipelines · Prithvi (lint, types, offline tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines/prithvi
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          working-directory: pipelines/prithvi
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest

  docker:
    name: Docker · science-api image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/science-api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
