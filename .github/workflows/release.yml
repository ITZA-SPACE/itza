name: Release

# Continuous delivery to Google Cloud Run on every push to main (needs the CI checks to pass).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/itza

jobs:
  science-api:
    name: Deploy science-api to Cloud Run
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: services/science-api
          push: true
          tags: |
            ${{ env.REGISTRY }}/science-api:${{ github.sha }}
            ${{ env.REGISTRY }}/science-api:latest
          cache-from: type=gha,scope=science-api
          cache-to: type=gha,mode=max,scope=science-api
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: itza-science-api
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.REGISTRY }}/science-api:${{ github.sha }}
          labels: |
            app=itza
          flags: >-
            --port=8000
            --service-account=${{ vars.GCP_RUNTIME_SA }}
            --allow-unauthenticated
            --min-instances=0
            --max-instances=3
          env_vars: |
            ITZA_ENVIRONMENT=production
            ITZA_CORS_ORIGINS=${{ vars.WEB_ORIGIN }}

  web:
    name: Deploy web to Cloud Run
    needs: science-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            VITE_SCIENCE_API_URL=${{ needs.science-api.outputs.url }}
            VITE_SI_GATEWAY_URL=${{ vars.SI_GATEWAY_URL }}
          tags: |
            ${{ env.REGISTRY }}/web:${{ github.sha }}
            ${{ env.REGISTRY }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: itza-web
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.REGISTRY }}/web:${{ github.sha }}
          labels: |
            app=itza
          flags: >-
            --port=8080
            --service-account=${{ vars.GCP_RUNTIME_SA }}
            --allow-unauthenticated
            --min-instances=0
            --max-instances=3
