[project]
name = "itza-science"
version = "0.1.0"
description = "ITZA Data & Science service: authenticated NASA access, field bundles, zones, projections and ML."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.4",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.17.4",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "itza_science"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC", "PT", "PL", "TID"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=itza_science",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
filterwarnings = ["error"]
markers = [
    "unit: isolated tests of a single module, no app or I/O",
    "integration: tests through the ASGI app and HTTP layer",
]

[tool.coverage.run]
branch = true
