[project]
name = "itza-science"
version = "0.1.0"
description = "ITZA Data & Science service: authenticated NASA access, field bundles, zones, projections and ML."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "affine==3.0.1",
    "earthaccess==0.19.0",
    "fastapi==0.162.4",
    "h5netcdf==1.8.3",
    "h5py==3.16.0",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "pyproj==3.8.0",
    "pyyaml==6.0.3",
    "rasterio==1.5.2",
    "rioxarray==0.23.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "shapely==2.2.0",
    "uvicorn[standard]==0.54.0",
    "xarray==2026.9.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.93.0",
    "httpx2==2.16.0",
    "jsonschema>=4.26.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.17.4",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261111",
    "types-shapely>=2.1.0.20261030",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "itza_science"

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated from schemas/ by `pnpm schemas:generate`; never edited by hand.
extend-exclude = ["src/itza_science/contracts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC", "PT", "PL", "TID"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

# No type stubs published for these; treated as untyped at the boundary only.
[[tool.mypy.overrides]]
module = ["shapely.*", "yaml.*", "rasterio.*", "rioxarray.*", "xarray.*", "earthaccess.*", "scipy.*", "sklearn.*", "h5py.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=itza_science",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
filterwarnings = [
    "error",
    # rioxarray's affine-transform math still uses `*`; upstream's own deprecation, not ours.
    "ignore:Use `@` matmul instead of `\\*` mul operator for matrix multiplication:PendingDeprecationWarning",
]
markers = [
    "unit: isolated tests of a single module, no app or I/O",
    "integration: tests through the ASGI app and HTTP layer",
]

[tool.coverage.run]
branch = true
